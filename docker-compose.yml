services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: panvel-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ':> /dev/tcp/127.0.0.1/6333'"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  indexer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: panvel-indexer
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
    command: ["python", "-m", "scripts.index_bulas"]
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: panvel-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      indexer:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: panvel-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  qdrant_storage: